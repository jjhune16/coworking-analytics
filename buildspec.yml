version: 0.2

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 216250383354.dkr.ecr.us-east-1.amazonaws.com
  build:
    commands:
      - echo Build started on `date`
      - echo Building the Docker image...
      - docker build -t coworking-analytics:1.0.0 .
      - docker tag coworking-analytics:1.0.0 216250383354.dkr.ecr.us-east-1.amazonaws.com/coworking-analytics:1.0.0
  post_build:
    commands:
      - echo Pushing the Docker image to ECR...
      - docker push 216250383354.dkr.ecr.us-east-1.amazonaws.com/coworking-analytics:1.0.0
      - echo Build completed on `date`